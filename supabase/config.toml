# Local Supabase config — used by `npx supabase start`.
# For production/cloud projects, settings live in the dashboard.

project_id = "salone-companion"

[api]
enabled = true
port    = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port           = 54322
shadow_port    = 54320
major_version  = 15

[studio]
enabled = true
port    = 54323

[inbucket]
enabled = true
port    = 54324

[auth]
enabled                  = true
site_url                 = "http://localhost:8081"
additional_redirect_urls = ["exp://*", "salonecompanion://*"]
jwt_expiry               = 3600
enable_signup            = true

[auth.email]
enable_signup     = true
double_confirm_changes = true
enable_confirmations   = true

# Magic-link is the primary auth flow per README.
[auth.email.template.magic_link]
subject = "Your Salone Companion sign-in link"

[storage]
enabled = true
file_size_limit = "50MiB"

# Buckets are created in production via the Storage REST API (see import-salone.mjs).
# The newer config.toml schema uses [storage.buckets.<name>] sub-tables;
# we keep this file minimal to stay compatible with future CLI versions.

[edge_runtime]
enabled = true
inspector_port = 8083
